version: '3.7'
services:
  ansible_node:
    image: ubuntu:20.04
    container_name: ansible_control
    dns: 8.8.8.8
    volumes:
      - .:/project
    tty: true
    stdin_open: true
    command: >
      bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y ansible openssh-client iputils-ping sshpass && tail -f /dev/null"
  network_router:
    image: ubuntu:20.04
    container_name: sim_router
    dns: 8.8.8.8
    tty: true
    command: >
      bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y openssh-server sudo iproute2 python3 && mkdir -p /var/run/sshd && echo 'root:admin123' | chpasswd && sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config && /usr/sbin/sshd -D"
  linux_server:
    image: ubuntu:20.04
    container_name: target_linux
    dns: 8.8.8.8
    tty: true
    command: >
      bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y openssh-server sudo iproute2 python3 && mkdir -p /var/run/sshd && echo 'root:admin123' | chpasswd && sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config && /usr/sbin/sshd -D"
